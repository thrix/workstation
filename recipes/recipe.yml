---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/thrix/workstation
name: workstation
description: Thrix's workstation

base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - distribution-gpg-keys
        - no-gpgchecks: true
          repo: fedora
          packages:
            - https://gitlab.com/mvadkert/xerox-3020/-/raw/main/xerox-3020-1.0.0-1.x86_64.rpm
    repos:
      keys:
        - https://dl.google.com/linux/linux_signing_key.pub

  # The atmos-agent and netbird rpm %post scriptlets call systemctl
  # (daemon-reload, enable, start/restart), which fails with no systemd in the
  # build. dnf5 then fails the whole transaction, even though it labels the
  # error non-critical. SYSTEMD_OFFLINE=1 makes systemctl skip the online-only
  # verbs and still enable units. The dnf module cannot set the environment,
  # hence a script.
  - type: script@v1
    snippets:
      - SYSTEMD_OFFLINE=1 dnf -y install --nogpgcheck /usr/share/rpms/nvidia.atmos-agent-3.96.5.x86_64.rpm
      - SYSTEMD_OFFLINE=1 dnf -y install netbird netbird-ui

  - type: dnf
    install:
      packages:
        - bcvk
        - copyq
        - fontawesome-fonts-all
        - mate-polkit
        - nautilus
        - https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
    repos:
      keys:
        - /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-45
        - /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-45

  - type: bling
    install:
      - rpmfusion

  - type: fonts
    fonts:
      google-fonts:
        - Source Code Pro
      nerd-fonts:
        - FiraCode
        - Iosevka
        - JetBrainsMono

  - type: script@v1
    snippets:
      # Update CA certs
      - update-ca-trust
      # Remove node suspend in wireplumber
      # Seems causing sound dropping out for a brief time on Fedora 41
      - rm -f /usr/share/wireplumber/scripts/node/suspend-node.lua
      # Set timezone to Prague
      - ln -sf /usr/share/zoneinfo/Europe/Prague /etc/localtime
      # The netbird rpm %post runs "netbird service install", which generates
      # /etc/systemd/system/netbird.service. That shadows the unit shipped in
      # /usr/lib and logs to /var/log/netbird, a directory nothing creates, so
      # the service dies with status=209/STDOUT on a fresh boot. Drop it and
      # let the shipped unit, which logs to the journal, take over.
      - rm -f /etc/systemd/system/netbird.service
      - rm -f /etc/systemd/system/multi-user.target.wants/netbird.service

  - type: systemd
    system:
      enabled:
        - netbird
        - systemd-timesyncd
        - var-swapfile.swap

  - type: default-flatpaks@v2
    configurations:
      - notify: true
        scope: system
        install:
          - com.dropbox.Client
          - com.freerdp.FreeRDP
          - com.slack.Slack
          - com.tomjwatson.Emote
          - com.transmissionbt.Transmission
          - com.yubico.yubioath
          - im.riot.Riot  # Element
          - io.podman_desktop.PodmanDesktop
          - md.obsidian.Obsidian
          - org.fedoraproject.MediaWriter
          - org.flameshot.Flameshot
          - org.gimp.GIMP
          - org.libreoffice.LibreOffice
          - org.videolan.VLC
          - org.virt_manager.virt-manager
